spring:
  # Permite cargar variables locales desde .env (no se sube a git).
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cine_db2?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 60MB
    connection-timeout: 5m

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 horas en milisegundos

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    show-common-extensions: true
    show-extensions: true
  use-fqn: true

file:
  upload-dir: ${UPLOAD_DIR:uploads}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
  frontend-url: ${MERCADOPAGO_FRONTEND_URL:http://localhost:4200}
  # Forzar checkout sandbox aunque el token no empiece con TEST-.
  test-mode: ${MERCADOPAGO_TEST_MODE:false}

app:
  oauth2:
    # A dónde redirige el backend con el JWT propio tras validar con Google.
    redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}"
    # A dónde redirige si el login social falla o la cuenta no puede ingresar.
    failure-uri: "${OAUTH2_FAILURE_URI:http://localhost:4200/login?error=google}"
