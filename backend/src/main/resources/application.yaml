spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cine_db2?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile

server:
  port: 8080
  tomcat:
    max-swallow-size: 60MB
    connection-timeout: 5m

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24 horas en milisegundos

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    show-common-extensions: true
    show-extensions: true
  use-fqn: true

file:
  upload-dir: uploads

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
  frontend-url: ${MERCADOPAGO_FRONTEND_URL:http://localhost:4200}

app:
  oauth2:
    # A dónde redirige el backend con el JWT propio tras validar con Google.
    redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}"
    # A dónde redirige si el login social falla o la cuenta no puede ingresar.
    failure-uri: "${OAUTH2_FAILURE_URI:http://localhost:4200/login?error=google}"
